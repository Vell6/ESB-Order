<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="chicken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Piring -->
  <ellipse cx="200" cy="165" rx="140" ry="95" fill="url(#plate)" stroke="#e2e8f0" stroke-width="4"/>
  <ellipse cx="200" cy="165" rx="115" ry="75" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Daun Pisang / Lalapan -->
  <path d="M 100 170 Q 140 130 190 150 Q 160 190 100 170 Z" fill="#22c55e" opacity="0.85"/>
  <circle cx="115" cy="155" r="16" fill="#ef4444"/> <!-- Tomat -->
  <circle cx="120" cy="180" r="14" fill="#86efac"/> <!-- Mentimun -->
  <!-- Ayam Bakar -->
  <path d="M 150 140 C 150 100 240 110 260 140 C 275 165 240 205 180 200 C 145 195 140 160 150 140 Z" fill="url(#chicken)"/>
  <path d="M 230 145 C 270 135 295 155 285 175 C 275 190 250 180 230 165 Z" fill="#92400e"/>
  <!-- Glaze Madu -->
  <path d="M 170 130 Q 210 120 230 145 Q 190 155 170 130 Z" fill="url(#glaze)"/>
  <!-- Sambal Terasi Merah -->
  <ellipse cx="240" cy="185" rx="26" ry="18" fill="#dc2626"/>
  <circle cx="235" cy="182" r="3" fill="#fef08a"/>
  <circle cx="245" cy="186" r="2.5" fill="#fef08a"/>
  <text x="200" y="275" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#881337" text-anchor="middle">Ayam Bakar Madu Bu Ani</text>
</svg>